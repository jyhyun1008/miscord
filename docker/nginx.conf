server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header는 location에 하나라도 있으면 상위 것을 상속하지 않으므로 각 location에서 include
    # (빌드 시 scripts/security-headers.mjs가 생성)

    # 해시가 붙은 빌드 산출물은 오래 캐시
    location /_nuxt/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # nginx 기본 mime.types에 webmanifest가 없음
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 링크 미리보기: 인스턴스의 /url(summaly)은 CORS 헤더가 없어서 같은 origin으로 중계
    # (개발 서버에서는 server/routes/url-preview.get.ts가 대신함)
    location = /url-preview {
        include /etc/nginx/snippets/security-headers.conf;
        # fetch만 붙일 수 있는 헤더 — <script src>나 페이지 이동으로는 못 불러오게
        if ($http_x_miscord_preview != "1") { return 403; }
        # 도메인 이름만 (IP·포트·localhost 불가)
        if ($arg_host !~ "^[a-z0-9-]+(\.[a-z0-9-]+)+$") { return 400; }
        if ($arg_host ~ "^[0-9.]+$") { return 400; }

        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        proxy_pass https://$arg_host/url?url=$arg_url&lang=ko;
        proxy_ssl_server_name on;
        proxy_ssl_name $arg_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header X-Miscord-Preview "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_redirect off;

        # 상대 서버가 무엇을 보내든 JSON으로만 취급
        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Content-Type "application/json" always;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA fallback: /callback, /@user@host/... 등 모든 경로를 index.html로
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}

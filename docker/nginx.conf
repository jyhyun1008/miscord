server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header는 location에 하나라도 있으면 상위 것을 상속하지 않으므로 각 location에서 include
    # (빌드 시 scripts/security-headers.mjs가 생성)

    # 해시가 붙은 빌드 산출물은 오래 캐시
    location /_nuxt/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # nginx 기본 mime.types에 webmanifest가 없음
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: /callback, /@user@host/... 등 모든 경로를 index.html로
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
